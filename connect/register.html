<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="auth.css" />
    <script src="auth.js"></script>
  </head>

  <body>
    <main class="card">
      <h1>Create account</h1>

      <form id="register-form">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          pattern="[A-Za-z0-9_.\-]{3,30}"
          title="3 to 30 characters: letters, numbers, _ . -"
          required
        />
        <small class="hint">3 to 30 characters: letters, numbers, _ . -</small>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <small class="hint">At least 8 characters</small>

        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" required />

        <button type="submit">Register</button>
        <p id="message" class="message" role="alert"></p>
      </form>

      <p class="switch">Already have an account? <a href="index.html">Log in</a></p>
    </main>

    <script>
      const registerForm = document.getElementById("register-form");
      const message = document.getElementById("message");

      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";

        const name = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm").value;

        if (password !== confirmPassword) {
          showMessage(message, "The passwords don't match.");
          return;
        }

        try {
          const result = await apiRequest("/register", {
            method: "POST",
            body: { name, password },
          });

          if (result.ok) {
            showMessage(message, "Account created! Taking you to the login page...", false);
            setTimeout(() => {
              window.location.href = "index.html";
            }, 1500);
          } else if (result.status === 422) {
            showMessage(message, "Please check the username and password rules.");
          } else {
            showMessage(message, errorMessage(result, "Registration failed. Please try again."));
          }
        } catch (error) {
          showMessage(message, "Can't reach the server. Is the backend running?");
        }
      });
    </script>
  </body>
</html>
